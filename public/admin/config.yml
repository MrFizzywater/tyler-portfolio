backend:
  name: github
  repo: MrFizzywater/tyler-portfolio
  branch: main
  base_url: https://auth.erikalacroix.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "visual"
    label: "Visual Works"
    folder: "src/content/visual"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Photography", "Video", "Direction", "Design"], default: "Photography" }
      - { label: "Year", name: "year", widget: "number", value_type: "int", default: 2026 }
      - { label: "Cover Media", name: "coverImage", widget: "image" }
      - { label: "Video URL (Optional)", name: "videoUrl", widget: "string", required: false }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body / Details", name: "body", widget: "markdown" }

  - name: "music"
    label: "Audio & Music"
    folder: "src/content/music"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Track / Release Title", name: "title", widget: "string" }
      - { label: "Project / Artist", name: "project", widget: "string", default: "ASPIRA" }
      - { label: "Role", name: "role", widget: "string", default: "Guitar / Production" }
      - { label: "Release Type", name: "releaseType", widget: "select", options: ["Single", "EP", "Album", "Riff / Demo", "Session"], default: "Single" }
      - { label: "Year", name: "year", widget: "number", value_type: "int", default: 2026 }
      - { label: "Artwork", name: "coverImage", widget: "image" }
      - { label: "Audio File or URL", name: "audioUrl", widget: "file", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Liner Notes / Description", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    delete: false
    files:
      - name: "general"
        label: "Branding & Headlines"
        file: "src/content/settings/general.json"
        format: "json"
        fields:
          - { label: "Monogram Fallback", name: "monogram", widget: "string", default: "TL" }
          - { label: "Logo Image", name: "logo", widget: "image", required: false }
          - { label: "Visual Page Headline", name: "visualHeadline", widget: "string", default: "Selected Visual Works" }
          - { label: "Visual Page Subtext", name: "visualSubtext", widget: "text" }
          - { label: "Audio Page Headline", name: "audioHeadline", widget: "string", default: "Guitar & Sonic Works" }
          - { label: "Audio Page Subtext", name: "audioSubtext", widget: "text" }

      - name: "about"
        label: "About & Contact Info"
        file: "src/content/settings/about.json"
        format: "json"
        fields:
          - { label: "Headline", name: "headline", widget: "string", default: "Tyler Lacroix" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Visual Artist & Guitarist" }
          - { label: "Profile Photo", name: "photo", widget: "image", required: false }
          - { label: "Bio / Details", name: "bio", widget: "markdown" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Instagram Link", name: "instagram", widget: "string", required: false }
          - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
          - { label: "Bandcamp / Music Link", name: "bandcamp", widget: "string", required: false }
